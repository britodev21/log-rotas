# Servidor da tela, dentro do contêiner.
#
# Quem termina o HTTPS é o Traefik, na frente; aqui é HTTP simples numa rede
# fechada. O que este arquivo faz: servir os arquivos do site, encaminhar
# /api para o backend e enviar os cabeçalhos de segurança — os mesmos
# conferidos no desenvolvimento (frontend/vite.config.js).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O que vale a pena comprimir. Imagem e fonte já vêm comprimidas.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json;
    gzip_min_length 1024;

    # ------------------------------------------------------------------ #
    # Segurança                                                           #
    # ------------------------------------------------------------------ #
    # `connect-src` inclui a Esri e as fontes porque o service worker busca
    # esses arquivos para guardar offline — e busca feita de dentro do
    # worker conta como connect-src, não como img-src. Sem isso o mapa do
    # motorista fica cinza (docs/SEGURANCA.md).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://services.arcgisonline.com; connect-src 'self' https://services.arcgisonline.com https://fonts.gstatic.com https://fonts.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # GPS e tela acesa só para a própria página; câmera e microfone, ninguém.
    add_header Permissions-Policy "geolocation=(self), screen-wake-lock=(self), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ------------------------------------------------------------------ #
    # A API                                                               #
    # ------------------------------------------------------------------ #
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # O IP real de quem fez o login — é dele que depende o bloqueio por
        # tentativas. $proxy_add_x_forwarded_for preserva o que o Traefik já
        # anotou e acrescenta o salto atual.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # O cálculo de rota pode passar de um minuto com muitas entregas.
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------ #
    # Arquivos                                                            #
    # ------------------------------------------------------------------ #
    # Nome com hash: o conteúdo nunca muda, então pode ficar guardado por um
    # ano. Um arquivo novo tem nome novo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O service worker e o manifesto NÃO podem ficar guardados: são eles que
    # avisam o aparelho de que existe versão nova. Guardados, o celular
    # continuaria abrindo a versão antiga por dias.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Rota do React: qualquer endereço desconhecido devolve a página, e o
    # navegador decide o que mostrar. Sem isto, recarregar em
    # /admin/relatorios daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
