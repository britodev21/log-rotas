# Lint e formatacao do backend do Log Rotas.
line-length = 96
target-version = "py314"

[lint]
select = [
    "E",    # pycodestyle
    "W",    # avisos de espaco em branco
    "F",    # pyflakes: nome nao usado, import morto
    "I",    # ordenacao de imports
    "UP",   # sintaxe moderna de Python
    "B",    # bugbear: armadilhas comuns
    "SIM",  # simplificacoes
    "RUF",  # regras do proprio ruff
]

[lint.per-file-ignores]
# Migrations sao geradas; nao vale brigar com o estilo delas.
"alembic/versions/*" = ["E501", "I001"]

[format]
quote-style = "double"
